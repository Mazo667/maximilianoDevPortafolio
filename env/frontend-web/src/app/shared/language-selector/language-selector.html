<div class="relative">
    <button (click)="toggleLangMenu($event)" aria-haspopup="true" [attr.aria-expanded]="isLangMenuOpen"
        [attr.aria-label]="currentLanguage().name"
        class="flex items-center gap-2 border rounded-lg px-3 py-2 md:px-4 transition-colors focus:outline-none focus:ring-2 shadow-sm"
        [class]="styles().button">
        <span class="text-lg">{{ currentLanguage().flag }}</span>
        <span class="hidden sm:inline-block font-medium text-sm">{{ currentLanguage().name }}</span>
        <svg class="w-4 h-4" [class]="styles().chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>

    @if(isLangMenuOpen) {
    <div class="absolute right-0 mt-2 w-44 border rounded-lg shadow-xl z-50 overflow-hidden" [class]="styles().menu"
        (click)="$event.stopPropagation()">
        <ul>
            @for(lang of languages; track lang.code) {
            <li>
                <button (click)="changeLanguage(lang.code)"
                    class="w-full text-left px-4 py-3 flex items-center gap-3 transition-colors"
                    [class]="styles().item + ' ' + (lang.code === currentLanguage().code ? styles().active : styles().inactive)">
                    <span class="text-xl">{{ lang.flag }}</span>
                    <span class="font-medium text-sm">{{ lang.name }}</span>
                </button>
            </li>
            }
        </ul>
    </div>
    }
</div>
