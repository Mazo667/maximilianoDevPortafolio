# Config de nginx del VPS para maximilianodev.com
# Va en /etc/nginx/sites-available/maximilianodev.com (enlazado desde sites-enabled)
# Sirve el build estatico: rsync de dist/frontend-web/browser/ a /var/www/portafolio-maxi/

server {
    server_name maximilianodev.com www.maximilianodev.com;

    root /var/www/portafolio-maxi;
    index index.html;

    # Redirecciones (en modo estatico no las puede hacer Angular)
    location = / {
        return 301 /home;
    }
    location = /optiscan/politica-de-privacidad {
        return 301 /optiscan/politicas-privacidad;
    }
    location = /optiscan/terminos-y-condiciones {
        return 301 /optiscan/terminos-uso;
    }

    # Paginas prerenderizadas sin "/" final; si no existe, Angular manda al home
    location / {
        try_files $uri $uri/index.html /index.csr.html;
        add_header Cache-Control "no-cache";
    }

    # JS y CSS llevan hash en el nombre: cache de 1 ano
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imagenes y PDF no tienen hash: cache de 1 semana
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|pdf)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/maximilianodev.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/maximilianodev.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.maximilianodev.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = maximilianodev.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name maximilianodev.com www.maximilianodev.com;
    return 404; # managed by Certbot
}
